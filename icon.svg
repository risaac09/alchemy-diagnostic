<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#131929"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a949" stop-opacity="1"/>
      <stop offset="50%" stop-color="#3dd6b5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9b7fd4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer torus ring -->
  <ellipse cx="256" cy="256" rx="170" ry="62" fill="none" stroke="#e8a949" stroke-width="2" opacity="0.55"/>
  <ellipse cx="256" cy="256" rx="170" ry="62" fill="none" stroke="#e8a949" stroke-width="2" opacity="0.25" filter="url(#glow)"/>
  <!-- Middle ring -->
  <ellipse cx="256" cy="256" rx="120" ry="44" fill="none" stroke="#3dd6b5" stroke-width="1.6" opacity="0.6"/>
  <!-- Inner ring -->
  <ellipse cx="256" cy="256" rx="70" ry="26" fill="none" stroke="#9b7fd4" stroke-width="1.4" opacity="0.7"/>
  <!-- Central glow / still point -->
  <circle cx="256" cy="256" r="80" fill="url(#core)" opacity="0.6"/>
  <circle cx="256" cy="256" r="3" fill="#e8e6d9"/>
</svg>
