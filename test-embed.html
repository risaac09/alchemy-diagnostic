<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embed Test Harness</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #ddd; padding: 24px; }
    iframe { width: 600px; border: 1px solid #444; }
    pre { background: #000; padding: 12px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Embed test harness</h1>
  <p>Loads <code>embed.html</code> in an iframe, captures postMessages, auto-resizes height.</p>
  <iframe id="frame" src="embed.html" title="Information Metabolism Diagnostic"></iframe>
  <h2>Captured messages</h2>
  <pre id="log"></pre>
  <script>
    const log = document.getElementById('log');
    const frame = document.getElementById('frame');
    window.__captured = [];
    window.addEventListener('message', (e) => {
      window.__captured.push(e.data);
      if (e.data?.type === 'height' && typeof e.data.px === 'number') {
        frame.style.height = e.data.px + 'px';
      }
      log.textContent = window.__captured.map(m => JSON.stringify(m)).join('\n');
    });
  </script>
</body>
</html>
